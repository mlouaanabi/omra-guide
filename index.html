<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Omra Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>body{font-family:system-ui,sans-serif}@keyframes sos{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}.sos-btn{animation:sos 1s infinite}
.dark{background:#111827!important;color:#f3f4f6}
.dark .bg-white{background:#1f2937!important}
.dark .bg-gray-100{background:#111827!important}
.dark .bg-gray-200{background:#374151!important}
.dark .text-gray-500{color:#9ca3af!important}
.dark .text-gray-400{color:#9ca3af!important}
.dark .text-gray-600{color:#d1d5db!important}
.dark .border{border-color:#374151!important}
.dark .border-t{border-color:#374151!important}
.dark .shadow-sm{box-shadow:0 1px 2px rgba(0,0,0,0.3)!important}
.dark input,.dark select,.dark textarea{background:#374151!important;color:#f3f4f6!important;border-color:#4b5563!important}
.dark input::placeholder{color:#9ca3af!important}
.doc-thumb{width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer}
.doc-preview{max-width:90vw;max-height:90vh;object-fit:contain}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const storage={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

function App(){
  const [pelerins,setPelerins]=useState([]);
  const [view,setView]=useState('dashboard');
  const [search,setSearch]=useState('');
  const [appel,setAppel]=useState({});
  const [editId,setEditId]=useState(null);
  const [hotels,setHotels]=useState({medine:[],makkah:[]});
  const [filters,setFilters]=useState({chambre:'',sexe:'',ageMin:'',ageMax:'',hotel:''});
  const [showFilters,setShowFilters]=useState(false);
  const [modal,setModal]=useState(null);
  const [urgence,setUrgence]=useState({consulat:'',agence:'',hotelMed:'',hotelMak:'',autre:''});
  const [darkMode,setDarkMode]=useState(false);
  const [tawafCount,setTawafCount]=useState(0);
  const [sayiCount,setSayiCount]=useState(0);
  const [spirituelTab,setSpirituelTab]=useState('guide');
  const [printModal,setPrintModal]=useState(false);
  const [villeChambres,setVilleChambres]=useState('medine');
  const [hotelModal,setHotelModal]=useState(false);
  const [newHotel,setNewHotel]=useState({nom:'',ville:'medine'});
  const [cloudCode,setCloudCode]=useState('');
  const [cloudModal,setCloudModal]=useState(null);
  const [myLocation,setMyLocation]=useState(null);
  const [locationLoading,setLocationLoading]=useState(false);
  const [imagePreview,setImagePreview]=useState(null);

  useEffect(()=>{
    const p=storage.get('pelerins');if(p)setPelerins(p);
    const h=storage.get('hotels');if(h)setHotels(h);
    const u=storage.get('urgence');if(u)setUrgence(u);
    const d=storage.get('darkMode');if(d)setDarkMode(d);
  },[]);

  useEffect(()=>{
    if(darkMode){document.documentElement.classList.add('dark')}
    else{document.documentElement.classList.remove('dark')}
    storage.set('darkMode',darkMode);
  },[darkMode]);

  const save=d=>{setPelerins(d);storage.set('pelerins',d)};
  const saveH=d=>{setHotels(d);storage.set('hotels',d)};
  const saveU=d=>{setUrgence(d);storage.set('urgence',d)};
  const call=n=>n&&(window.location.href='tel:'+n.replace(/\s/g,''));
  const wa=n=>n&&window.open('https://wa.me/'+n.replace(/\s/g,'').replace(/^0/,'33'));
  const age=d=>{if(!d)return null;const t=new Date(),b=new Date(d);let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a};

  const resetAll=()=>{
    if(!confirm('⚠️ ATTENTION : Voulez-vous vraiment réinitialiser TOUTES les données ?\n\nCela supprimera :\n- Tous les pèlerins\n- Tous les hôtels\n- Toutes les configurations\n- Tous les documents\n\nCette action est IRRÉVERSIBLE !'))return;
    if(!confirm('⚠️ DERNIÈRE CONFIRMATION\n\nÊtes-vous absolument certain de vouloir tout effacer ?\n\nPensez à faire une sauvegarde cloud avant !'))return;
    
    setPelerins([]);
    setHotels({medine:[],makkah:[]});
    setUrgence({consulat:'',agence:'',hotelMed:'',hotelMak:'',autre:''});
    setAppel({});
    setTawafCount(0);
    setSayiCount(0);
    
    storage.set('pelerins',[]);
    storage.set('hotels',{medine:[],makkah:[]});
    storage.set('urgence',{consulat:'',agence:'',hotelMed:'',hotelMak:'',autre:''});
    
    alert('✅ Toutes les données ont été réinitialisées !\n\nVous pouvez maintenant commencer un nouveau voyage.');
  };

  const exportToCloud=()=>{
    const data={
      pelerins,
      hotels,
      urgence,
      date:new Date().toISOString(),
      version:'2.0'
    };
    const json=JSON.stringify(data);
    const encoded=btoa(encodeURIComponent(json));
    setCloudCode(encoded);
    setCloudModal('export');
  };

  const importFromCloud=()=>{
    if(!cloudCode.trim()){alert('❌ Veuillez coller un code de sauvegarde');return}
    try{
      const json=decodeURIComponent(atob(cloudCode.trim()));
      const data=JSON.parse(json);
      
      if(!data.version){throw new Error('Format invalide')}
      
      if(!confirm(`📥 Importer cette sauvegarde ?\n\nDate : ${new Date(data.date).toLocaleString('fr-FR')}\nPèlerins : ${data.pelerins?.length||0}\n\n⚠️ Cela écrasera vos données actuelles !`))return;
      
      if(data.pelerins)save(data.pelerins);
      if(data.hotels)saveH(data.hotels);
      if(data.urgence)saveU(data.urgence);
      
      setCloudModal(null);
      setCloudCode('');
      alert('✅ Sauvegarde importée avec succès !');
    }catch(e){
      alert('❌ Code invalide ou corrompu\n\nVérifiez que vous avez copié le code complet.');
    }
  };

  const downloadBackup=()=>{
    const data={
      pelerins,
      hotels,
      urgence,
      date:new Date().toISOString(),
      version:'2.0'
    };
    const json=JSON.stringify(data,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`omra-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const restoreBackup=f=>{
    if(!f)return;
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        if(!data.version){throw new Error('Format invalide')}
        
        if(!confirm(`📥 Restaurer ce backup ?\n\nDate : ${new Date(data.date).toLocaleString('fr-FR')}\nPèlerins : ${data.pelerins?.length||0}\n\n⚠️ Cela écrasera vos données actuelles !`))return;
        
        if(data.pelerins)save(data.pelerins);
        if(data.hotels)saveH(data.hotels);
        if(data.urgence)saveU(data.urgence);
        
        setModal(null);
        alert('✅ Backup restauré avec succès !');
      }catch(e){
        alert('❌ Fichier invalide ou corrompu');
      }
    };
    reader.readAsText(f);
  };

  const copyToClipboard=text=>{
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(()=>alert('✅ Code copié dans le presse-papiers !'));
    }else{
      const ta=document.createElement('textarea');
      ta.value=text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert('✅ Code copié !');
    }
  };

  const getMyLocation=()=>{
    setLocationLoading(true);
    if(!navigator.geolocation){
      alert('❌ Géolocalisation non disponible sur cet appareil');
      setLocationLoading(false);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const loc={lat:pos.coords.latitude,lng:pos.coords.longitude,time:new Date().toISOString()};
        setMyLocation(loc);
        setLocationLoading(false);
        alert('✅ Position obtenue !');
      },
      err=>{
        alert('❌ Impossible d\'obtenir la position\n\nVérifiez que vous avez autorisé l\'accès à la localisation.');
        setLocationLoading(false);
      },
      {enableHighAccuracy:true,timeout:10000}
    );
  };

  const shareMyLocationToAll=()=>{
    if(!myLocation){
      alert('❌ Obtenez d\'abord votre position en cliquant sur "Obtenir ma position"');
      return;
    }
    const mapsUrl=`https://www.google.com/maps?q=${myLocation.lat},${myLocation.lng}`;
    const message=`📍 Localisation du guide\n\nVoici ma position actuelle :\n${mapsUrl}\n\n🕋 Omra Guide`;
    const withWhatsapp=pelerins.filter(p=>p.whatsapp);
    if(!withWhatsapp.length){
      alert('❌ Aucun pèlerin n\'a de numéro WhatsApp');
      return;
    }
    if(!confirm(`Envoyer ma position à ${withWhatsapp.length} pèlerin(s) via WhatsApp ?`))return;
    
    withWhatsapp.forEach((p,i)=>{
      setTimeout(()=>{
        const phone=p.whatsapp.replace(/\s/g,'').replace(/^0/,'33');
        const url=`https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        window.open(url,'_blank');
      },i*1500);
    });
  };

  const requestPelerinLocation=p=>{
    if(!p.whatsapp){alert('❌ Pas de WhatsApp');return}
    const message=`Salam ${p.prenom},\n\nMerci de partager votre localisation :\n\n1️⃣ Cliquez sur le trombone 📎\n2️⃣ Sélectionnez "Position"\n3️⃣ Envoyez votre position actuelle\n\nBarakAllahu fik 🤲\n\n🕋 Omra Guide`;
    const phone=p.whatsapp.replace(/\s/g,'').replace(/^0/,'33');
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`,'_blank');
  };

  const addHotel=()=>{
    if(!newHotel.nom.trim())return;
    const updated={...hotels,[newHotel.ville]:[...hotels[newHotel.ville],newHotel.nom.trim()]};
    setHotels(updated);saveH(updated);setNewHotel({nom:'',ville:'medine'});setHotelModal(false);
  };
  const delHotel=(ville,nom)=>{
    const updated={...hotels,[ville]:hotels[ville].filter(h=>h!==nom)};
    setHotels(updated);saveH(updated);
  };

  const handleFile=f=>{
    if(!f)return;
    if(f.name.endsWith('.csv'))Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>importData(r.data)});
    else{const rd=new FileReader();rd.onload=e=>{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});importData(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]))};rd.readAsArrayBuffer(f)}
  };

  const importData=data=>{
    const n=s=>s?s.toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""):'';
    const imp=data.map(r=>{const o={};Object.keys(r).forEach(k=>o[n(k)]=r[k]);return{id:Date.now()+Math.random(),nom:o.nom||'',prenom:o.prenom||'',sexe:o.sexe?.toString().charAt(0).toUpperCase()==='F'?'F':o.sexe?.toString().charAt(0).toUpperCase()==='M'?'M':'',dateNaissance:o['date naissance']||o.naissance||'',nomFamille:o.famille||'',lienFamilial:o.lien||'',whatsapp:o.whatsapp||o.telephone||'',chambreMedine:o['chambre medine']||o.medine||'',chambreMakkah:o['chambre makkah']||o.makkah||'',hotelMedine:o['hotel medine']||'',hotelMakkah:o['hotel makkah']||'',commentaire:o.commentaire||'',documents:{photo:'',passeport:'',visa:''}}}).filter(p=>p.nom&&p.prenom);
    if(!imp.length){alert('Aucune donnée');return}
    save([...pelerins,...imp]);setModal(null);alert('✅ '+imp.length+' importé(s)');
  };

  const exportXL=()=>{
    const d=pelerins.map(p=>({Nom:p.nom,Prenom:p.prenom,Sexe:p.sexe,Famille:p.nomFamille,'Chambre Medine':p.chambreMedine,'Chambre Makkah':p.chambreMakkah,WhatsApp:p.whatsapp,Commentaire:p.commentaire}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d),"Pelerins");XLSX.writeFile(wb,'pelerins.xlsx');
  };

  const printListeAppel=()=>{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    doc.setFontSize(18);
    doc.text('Liste d\'appel - Omra',105,15,{align:'center'});
    doc.setFontSize(10);
    doc.text('Date: '+new Date().toLocaleDateString('fr-FR'),105,22,{align:'center'});
    
    const data=pelerins.map((p,i)=>[i+1,p.nom?.toUpperCase(),p.prenom,p.sexe==='F'?'F':'M',p.nomFamille||'-','☐']);
    doc.autoTable({
      head:[['N°','NOM','Prénom','S','Famille','✓']],
      body:data,
      startY:30,
      styles:{fontSize:9,cellPadding:3},
      headStyles:{fillColor:[22,163,74]},
      columnStyles:{0:{cellWidth:10},4:{cellWidth:30},5:{cellWidth:12,halign:'center'}}
    });
    doc.save('liste_appel_omra.pdf');
  };

  const printRoomingList=(ville)=>{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    doc.setFontSize(18);
    doc.text('Rooming List - '+(ville==='medine'?'Médine':'Makkah'),105,15,{align:'center'});
    doc.setFontSize(10);
    doc.text('Date: '+new Date().toLocaleDateString('fr-FR'),105,22,{align:'center'});
    
    const chambreField=ville==='medine'?'chambreMedine':'chambreMakkah';
    const hotelField=ville==='medine'?'hotelMedine':'hotelMakkah';
    
    const chambres={};
    pelerins.filter(p=>p[chambreField]).forEach(p=>{
      const num=p[chambreField];
      if(!chambres[num])chambres[num]={hotel:p[hotelField]||'-',occupants:[]};
      chambres[num].occupants.push(p);
    });
    
    const data=[];
    Object.keys(chambres).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(num=>{
      const ch=chambres[num];
      ch.occupants.forEach((p,i)=>{
        data.push([i===0?num:'',i===0?ch.hotel:'',p.nom?.toUpperCase()+' '+p.prenom,p.sexe==='F'?'F':'M',p.whatsapp||'-']);
      });
    });
    
    doc.autoTable({
      head:[['Ch.','Hôtel','Nom Prénom','S','WhatsApp']],
      body:data,
      startY:30,
      styles:{fontSize:9,cellPadding:3},
      headStyles:{fillColor:[22,163,74]},
      columnStyles:{0:{cellWidth:15},1:{cellWidth:35},3:{cellWidth:10}}
    });
    doc.save('rooming_list_'+ville+'.pdf');
  };

  const printFicheChambres=(ville)=>{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    
    const chambreField=ville==='medine'?'chambreMedine':'chambreMakkah';
    const hotelField=ville==='medine'?'hotelMedine':'hotelMakkah';
    
    const chambres={};
    pelerins.filter(p=>p[chambreField]).forEach(p=>{
      const num=p[chambreField];
      if(!chambres[num])chambres[num]={hotel:p[hotelField]||'-',occupants:[]};
      chambres[num].occupants.push(p);
    });
    
    let y=15;
    const nums=Object.keys(chambres).sort((a,b)=>parseInt(a)-parseInt(b));
    
    nums.forEach((num,idx)=>{
      if(y>250){doc.addPage();y=15;}
      const ch=chambres[num];
      
      doc.setFillColor(22,163,74);
      doc.rect(10,y,190,10,'F');
      doc.setTextColor(255,255,255);
      doc.setFontSize(12);
      doc.text('Chambre '+num+(ch.hotel?' - '+ch.hotel:''),15,y+7);
      doc.setTextColor(0,0,0);
      y+=15;
      
      ch.occupants.forEach(p=>{
        doc.setFontSize(10);
        doc.text('• '+p.nom?.toUpperCase()+' '+p.prenom+' ('+( p.sexe==='F'?'F':'M')+')',15,y);
        if(p.whatsapp){doc.setFontSize(8);doc.text('   📱 '+p.whatsapp,15,y+4);y+=4;}
        if(p.commentaire){doc.setFontSize(8);doc.setTextColor(200,100,0);doc.text('   ⚠️ '+p.commentaire,15,y+4);doc.setTextColor(0,0,0);y+=4;}
        y+=8;
      });
      y+=5;
    });
    
    doc.save('fiches_chambres_'+ville+'.pdf');
  };

  const printTrombinoscope=()=>{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    doc.setFontSize(18);
    doc.text('Liste des pèlerins - Omra',105,15,{align:'center'});
    doc.setFontSize(10);
    doc.text(pelerins.length+' pèlerin(s) - '+new Date().toLocaleDateString('fr-FR'),105,22,{align:'center'});
    
    let y=35;
    let x=15;
    
    pelerins.forEach((p,i)=>{
      if(y>270){doc.addPage();y=15;x=15;}
      if(x>150){x=15;y+=45;}
      
      doc.setDrawColor(200,200,200);
      doc.rect(x,y,55,40);
      
      if(p.documents?.photo){
        try{
          doc.addImage(p.documents.photo,'JPEG',x+2,y+2,20,20);
        }catch(e){
          doc.setFillColor(p.sexe==='F'?236:59,p.sexe==='F'?72:130,p.sexe==='F'?153:246);
          doc.circle(x+12,y+12,10,'F');
        }
      }else{
        doc.setFillColor(p.sexe==='F'?236:59,p.sexe==='F'?72:130,p.sexe==='F'?153:246);
        doc.circle(x+12,y+12,10,'F');
      }
      
      doc.setTextColor(255,255,255);
      doc.setFontSize(12);
      if(!p.documents?.photo){
        doc.text((p.prenom?.[0]||'')+(p.nom?.[0]||''),x+12,y+15,{align:'center'});
      }
      
      doc.setTextColor(0,0,0);
      doc.setFontSize(8);
      doc.text(p.prenom||'',x+27,y+10);
      doc.setFontSize(9);
      doc.text(p.nom?.toUpperCase()||'',x+27,y+16);
      doc.setFontSize(7);
      doc.setTextColor(100,100,100);
      if(p.chambreMedine)doc.text('Med: '+p.chambreMedine,x+27,y+22);
      if(p.chambreMakkah)doc.text('Mak: '+p.chambreMakkah,x+27,y+27);
      if(p.nomFamille)doc.text('Fam: '+p.nomFamille,x+27,y+32);
      
      x+=60;
    });
    
    doc.save('liste_pelerins_omra.pdf');
  };

  const filtered=pelerins.filter(p=>{
    if(search&&!p.nom?.toLowerCase().includes(search.toLowerCase())&&!p.prenom?.toLowerCase().includes(search.toLowerCase()))return false;
    if(filters.chambre&&!p.chambreMedine?.includes(filters.chambre)&&!p.chambreMakkah?.includes(filters.chambre))return false;
    if(filters.sexe&&p.sexe!==filters.sexe)return false;
    if(filters.hotel&&p.hotelMedine!==filters.hotel&&p.hotelMakkah!==filters.hotel)return false;
    const a=age(p.dateNaissance);
    if(filters.ageMin&&(a===null||a<parseInt(filters.ageMin)))return false;
    if(filters.ageMax&&(a===null||a>parseInt(filters.ageMax)))return false;
    return true;
  });

  const familles=[...new Set(pelerins.map(p=>p.nomFamille).filter(Boolean))];
  const stats={total:pelerins.length,fam:familles.length,h:pelerins.filter(p=>p.sexe==='M').length,f:pelerins.filter(p=>p.sexe==='F').length};

  const docsStats={
    photo:pelerins.filter(p=>p.documents?.photo).length,
    passeport:pelerins.filter(p=>p.documents?.passeport).length,
    visa:pelerins.filter(p=>p.documents?.visa).length,
    complet:pelerins.filter(p=>p.documents?.photo&&p.documents?.passeport&&p.documents?.visa).length
  };

  return(
    <div className="min-h-screen bg-gray-100 pb-20">
      <div className="bg-green-600 text-white px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <span className="text-2xl">🕋</span>
          <div><div className="font-bold">Omra Guide</div><div className="text-xs text-green-100">{pelerins.length} pèlerin(s)</div></div>
        </div>
        <button onClick={()=>setDarkMode(!darkMode)} className="text-2xl p-2">{darkMode?'☀️':'🌙'}</button>
      </div>

      <div className="p-4 space-y-4">
        {view==='dashboard'&&<>
          <div className="grid grid-cols-2 gap-3">
            <button onClick={()=>setView('list')} className="bg-blue-500 text-white rounded-xl p-4 text-left active:scale-95 transition-transform"><div className="text-2xl font-bold">{stats.total}</div><div className="text-xs">Pèlerins</div></button>
            <button onClick={()=>setView('familles')} className="bg-purple-500 text-white rounded-xl p-4 text-left active:scale-95 transition-transform"><div className="text-2xl font-bold">{stats.fam}</div><div className="text-xs">Familles</div></button>

    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        const max=800;
        if(w>max||h>max){
          if(w>h){h=h*(max/w);w=max}
          else{w=w*(max/h);h=max}
        }
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        const compressed=canvas.toDataURL('image/jpeg',0.7);
        setF({...f,documents:{...f.documents,[type]:compressed}});
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  };

  const removeDoc=type=>{
    if(!confirm('Supprimer ce document ?'))return;
    setF({...f,documents:{...f.documents,[type]:''}});
  };

  return(
    <div className="bg-white rounded-xl p-4 shadow-sm">
      <div className="font-bold mb-4">{p?'✏️ Modifier':'➕ Ajouter'}</div>
      <div className="space-y-3">
        <div className="grid grid-cols-2 gap-2">
          <input placeholder="Nom*" value={f.nom} onChange={e=>setF({...f,nom:e.target.value})} className="border rounded-xl px-3 py-2"/>
          <input placeholder="Prénom*" value={f.prenom} onChange={e=>setF({...f,prenom:e.target.value})} className="border rounded-xl px-3 py-2"/>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <select value={f.sexe} onChange={e=>setF({...f,sexe:e.target.value})} className="border rounded-xl px-3 py-2">
            <option value="">Sexe</option>
            <option value="M">Homme</option>
            <option value="F">Femme</option>
          </select>
          <input type="date" value={f.dateNaissance} onChange={e=>setF({...f,dateNaissance:e.target.value})} className="border rounded-xl px-3 py-2"/>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <input placeholder="Famille" value={f.nomFamille} onChange={e=>setF({...f,nomFamille:e.target.value})} className="border rounded-xl px-3 py-2"/>
          <select value={f.lienFamilial} onChange={e=>setF({...f,lienFamilial:e.target.value})} className="border rounded-xl px-3 py-2">
            <option value="">Lien</option>
            <option>Époux</option>
            <option>Épouse</option>
            <option>Père</option>
            <option>Mère</option>
            <option>Fils</option>
            <option>Fille</option>
          </select>
        </div>
        <input placeholder="WhatsApp" value={f.whatsapp} onChange={e=>setF({...f,whatsapp:e.target.value})} className="w-full border rounded-xl px-3 py-2"/>
        
        <div className="font-bold text-sm pt-2 border-t">📄 Documents</div>
        <div className="grid grid-cols-3 gap-2">
          <div className="text-center">
            <div className="text-xs mb-1">📸 Photo</div>
            {f.documents.photo?
              <div className="relative">
                <img src={f.documents.photo} className="doc-thumb mx-auto mb-1"/>
                <button onClick={()=>removeDoc('photo')} className="absolute -top-1 -right-1 bg-red-500 text-white w-5 h-5 rounded-full text-xs">×</button>
              </div>:
              <label className="block w-full bg-green-50 border-2 border-dashed border-green-300 rounded-lg p-2 cursor-pointer">
                <div className="text-2xl">+</div>
                <input type="file" accept="image/*" capture="user" onChange={e=>e.target.files[0]&&handleImage('photo',e.target.files[0])} className="hidden"/>
              </label>
            }
          </div>
          <div className="text-center">
            <div className="text-xs mb-1">🛂 Passeport</div>
            {f.documents.passeport?
              <div className="relative">
                <img src={f.documents.passeport} className="doc-thumb mx-auto mb-1"/>
                <button onClick={()=>removeDoc('passeport')} className="absolute -top-1 -right-1 bg-red-500 text-white w-5 h-5 rounded-full text-xs">×</button>
              </div>:
              <label className="block w-full bg-blue-50 border-2 border-dashed border-blue-300 rounded-lg p-2 cursor-pointer">
                <div className="text-2xl">+</div>
                <input type="file" accept="image/*" onChange={e=>e.target.files[0]&&handleImage('passeport',e.target.files[0])} className="hidden"/>
              </label>
            }
          </div>
          <div className="text-center">
            <div className="text-xs mb-1">🇸🇦 Visa</div>
            {f.documents.visa?
              <div className="relative">
                <img src={f.documents.visa} className="doc-thumb mx-auto mb-1"/>
                <button onClick={()=>removeDoc('visa')} className="absolute -top-1 -right-1 bg-red-500 text-white w-5 h-5 rounded-full text-xs">×</button>
              </div>:
              <label className="block w-full bg-purple-50 border-2 border-dashed border-purple-300 rounded-lg p-2 cursor-pointer">
                <div className="text-2xl">+</div>
                <input type="file" accept="image/*" onChange={e=>e.target.files[0]&&handleImage('visa',e.target.files[0])} className="hidden"/>
              </label>
            }
          </div>
        </div>
        
        <div className="font-bold text-sm pt-2 border-t">🏨 Médine</div>
        <div className="grid grid-cols-3 gap-2">
          <input placeholder="Hôtel" value={f.hotelMedine} onChange={e=>setF({...f,hotelMedine:e.target.value})} className="border rounded-xl px-3 py-2"/>
          <input placeholder="N° Chambre" value={f.chambreMedine} onChange={e=>setF({...f,chambreMedine:e.target.value})} className="border rounded-xl px-3 py-2"/>
          <select value={f.typeChambreMedine} onChange={e=>setF({...f,typeChambreMedine:e.target.value})} className="border rounded-xl px-3 py-2">
            <option value="">Type</option>
            <option>Duo</option>
            <option>Triple</option>
            <option>Quadruple</option>
          </select>
        </div>
        
        <div className="font-bold text-sm pt-2">🕋 Makkah</div>
        <div className="grid grid-cols-3 gap-2">
          <input placeholder="Hôtel" value={f.hotelMakkah} onChange={e=>setF({...f,hotelMakkah:e.target.value})} className="border rounded-xl px-3 py-2"/>
          <input placeholder="N° Chambre" value={f.chambreMakkah} onChange={e=>setF({...f,chambreMakkah:e.target.value})} className="border rounded-xl px-3 py-2"/>
          <select value={f.typeChambreMakkah} onChange={e=>setF({...f,typeChambreMakkah:e.target.value})} className="border rounded-xl px-3 py-2">
            <option value="">Type</option>
            <option>Duo</option>
            <option>Triple</option>
            <option>Quadruple</option>
          </select>
        </div>
        
        <textarea placeholder="Commentaire santé" value={f.commentaire} onChange={e=>setF({...f,commentaire:e.target.value})} className="w-full border rounded-xl px-3 py-2" rows={2}/>
      </div>
      <div className="flex gap-3 mt-4">
        <button onClick={onCancel} className="flex-1 border py-2 rounded-xl">Annuler</button>
        <button onClick={()=>{if(!f.nom||!f.prenom){alert('Nom et prénom requis');return}onSave(f)}} className="flex-1 bg-green-600 text-white py-2 rounded-xl">💾 Sauver</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
